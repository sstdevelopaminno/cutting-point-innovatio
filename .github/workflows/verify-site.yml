name: Verify Company Site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-site-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Public alert CDN cache regression
        run: node scripts/verify-emergency-broadcast-cache.mjs
      - name: Native Mobile stable version contract
        run: node scripts/verify-native-mobile-download.mjs
      - name: Signed QA 2.1.4 domain contract
        run: node scripts/verify-native-qa-214-download.mjs
      - name: Production build
        run: |
          set -euo pipefail
          # next/font/google occasionally returns an invalid remote font
          # response from the upstream provider. Retry the exact same build
          # with a clean Next cache, but never mark a failed build as passed.
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Production build failed after three attempts"
              exit 1
            fi
            rm -rf .next
            sleep 12
          done

      - name: Verify pinned CDN APK bytes and SHA-256 after build
        run: npm run verify:apks

name: Deploy CpiPOS Company WWW Production

on:
  workflow_dispatch:
  # Trigger once when this workflow is first merged; future deploys remain
  # explicitly controlled (updates to this file / manual dispatch).
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-www-production.yml"

permissions:
  contents: read

concurrency:
  group: cpipos-company-www-production
  cancel-in-progress: false

jobs:
  deploy-www:
    name: Deploy existing www.cuttingpointinnovation.com project
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TEAM_ID: team_ZKmv6uQSU9QUyP08mxAr2YDI
      VERCEL_PROJECT_ID: prj_Zc2C5E5drYdfZfyAMBdV9Zmq1A4U
      VERCEL_PROJECT_NAME: cutting-point-tech
      VERCEL_CLI_VERSION: 59.19.1

    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify presence of authorized Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN repository secret is missing; only a project owner can add it."
            exit 1
          fi
      - name: Confirm exact existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          project=$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")
          actual_id=$(printf '%s' "$project" | jq -r '.id // empty')
          actual_name=$(printf '%s' "$project" | jq -r '.name // empty')
          if [ "$actual_id" != "$VERCEL_PROJECT_ID" ] || [ "$actual_name" != "$VERCEL_PROJECT_NAME" ]; then
            echo "::error::Vercel token does not authorize the expected company WWW project."
            exit 1
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          echo "Verified existing company WWW project ID"
      - name: Install locked site dependencies
        run: npm ci --no-audit
      - name: Verify site code
        run: npm run lint
      - name: Pull existing Production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION pull
          --yes --environment=production
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_TEAM_ID"
      - name: Build www Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION build
          --prod --token="$VERCEL_TOKEN"
          --scope="$VERCEL_TEAM_ID"
      - name: Deploy only existing www Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >
          npx --yes vercel@$VERCEL_CLI_VERSION deploy
          --prebuilt --prod
          --token="$VERCEL_TOKEN"
          --scope="$VERCEL_TEAM_ID"

name: Remove completed one-time housekeeping branch
on:
  push:
    branches:
      - chore/cleanup-merged-branches-20261028

permissions:
  contents: write

jobs:
  cleanup-branch:
    if: github.repository == 'sstdevelopaminno/cutting-point-innovatio'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove temporary branch after successful cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "chore/cleanup-merged-branches-20261028"
          expected_sha="$GITHUB_SHA"
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" --jq '.commit.sha')
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::Unexpected branch head; refusing self-removal"
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" > /dev/null
          echo "Temporary cleanup branch removed. The 12 previously audited stale branches remain deleted." >> "$GITHUB_STEP_SUMMARY"

name: Public Production Smoke

on:
  workflow_dispatch:
  schedule:
    # Daily at 10:30 Asia/Bangkok. Read-only public GET requests.
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: public-production-smoke
  cancel-in-progress: true

jobs:
  check-public-surfaces:
    name: Company / POS / IT public access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only monitoring script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify public routes without login, billing or data writes
        run: node scripts/verify-public-production-surfaces.mjs
